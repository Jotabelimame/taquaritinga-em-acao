<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquaritinga em Ação • Painel de Administração</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Target Mode JS/CSS -->
    <link rel="stylesheet" href="scripts/target-mode.css">
    <script src="scripts/target-mode.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        prim: '#0284c7',
                        sec: '#10b981',
                        pendente: '#f59e0b',
                        ok: '#10b981',
                        escuro: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card { @apply bg-white dark:bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700; }
            .btn { @apply px-4 py-2 rounded-lg font-medium transition-all inline-flex items-center justify-center gap-2; }
            .btn-prim { @apply bg-sky-600 hover:bg-sky-700 text-white; }
            .btn-sec { @apply bg-emerald-600 hover:bg-emerald-700 text-white; }
            .btn-alert { @apply bg-amber-500 hover:bg-amber-600 text-white; }
            .btn-danger { @apply bg-red-600 hover:bg-red-700 text-white; }
            .input { @apply w-full p-2 border border-slate-300 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-sky-500; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
    <header class="bg-slate-900 text-white py-5 px-6 shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold font-['Outfit']"><i class="fa-solid fa-gear text-sky-500 mr-2"></i>Painel de Administração</h1>
                <p class="text-sm text-slate-400">Auditoria GPS • Cadastro de Fotos • Taquaritinga/SP (2026)</p>
            </div>
            <div class="flex gap-3 flex-wrap">
                <a href="index.html" class="btn bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> Voltar ao Site
                </a>
                <button id="btnNovo" class="btn btn-sec text-sm"><i class="fa-solid fa-plus"></i> Novo Local</button>
                <button id="btnExportar" class="btn btn-prim text-sm"><i class="fa-solid fa-download"></i> Exportar locais.json</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 mt-4">
        <!-- Barra de estatísticas e busca -->
        <div class="card mb-6">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <div class="text-sm font-medium">
                    Total: <span id="totalReg" class="font-bold text-sky-400">0</span> locais | 
                    Concluídos (Com Fotos): <span id="totalOk" class="text-emerald-400 font-bold">0</span> | 
                    Pendentes: <span id="totalPend" class="text-amber-400 font-bold">0</span>
                </div>
                <div class="w-full md:w-80 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="inputBusca" oninput="atualizarTabela()" placeholder="Buscar por local, rua ou bairro..." class="input pl-9 text-sm">
                </div>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full card">
                <thead>
                    <tr class="border-b dark:border-slate-700 text-left text-xs uppercase tracking-wider text-slate-400">
                        <th class="py-3 px-3">ID</th>
                        <th class="py-3 px-3">Nome do Local</th>
                        <th class="py-3 px-3">Endereço / Bairro</th>
                        <th class="py-3 px-3">Coordenadas GPS</th>
                        <th class="py-3 px-3">Status</th>
                        <th class="py-3 px-3 text-right">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaLocais"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL DE EDIÇÃO/CRIAÇÃO -->
    <div id="modalEditar" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center">
                <h2 id="tituloModal" class="text-xl font-bold font-['Outfit'] text-white">Editar Local & Auditoria GPS</h2>
                <button id="btnFechar" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-5 grid md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <input type="hidden" id="editId">
                    <div>
                        <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Nome do Local / Ponto de Referência</label>
                        <input type="text" id="editNome" class="input">
                    </div>
                    <div>
                        <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Endereço Completo</label>
                        <input type="text" id="editEndereco" class="input">
                    </div>
                    <div>
                        <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Bairro</label>
                        <input type="text" id="editBairro" class="input">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Latitude</label>
                            <input type="text" id="editLat" class="input" onchange="atualizarMapaPorInputs()">
                        </div>
                        <div>
                            <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Longitude</label>
                            <input type="text" id="editLng" class="input" onchange="atualizarMapaPorInputs()">
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Link Álbum Google Fotos / Drive</label>
                        <input type="text" id="editFotos" class="input" placeholder="https://photos.app.goo.gl/..." oninput="autoDefinirStatus()">
                    </div>
                    <div>
                        <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Status</label>
                        <select id="editStatus" class="input">
                            <option value="pendente">⏳ Pendente (Em Vistoria)</option>
                            <option value="concluido">✅ Concluído (Com Fotos)</option>
                        </select>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button id="btnSalvar" class="btn btn-sec flex-1"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
                        <button id="btnCancelar" class="btn btn-alert"><i class="fa-solid fa-xmark"></i> Cancelar</button>
                    </div>
                </div>
                <div>
                    <label class="block mb-1 text-xs font-semibold text-slate-400 uppercase">Mapa Auditoria GPS (Arraste ou clique)</label>
                    <div id="mapaAuditoria" class="w-full h-[360px] rounded-lg border border-slate-800 overflow-hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let dadosCompleto = { locais: [], rotas: [] };
        let dadosLocais = [];
        let mapa, marcador;
        const URL_DADOS = './dados/locais.json';

        // Carregar dados iniciais
        async function carregarDados() {
            try {
                const res = await fetch(URL_DADOS);
                if(res.ok) {
                    dadosCompleto = await res.json();
                    dadosLocais = dadosCompleto.locais || dadosCompleto;
                }
                atualizarTabela();
            } catch (e) {
                console.warn('Iniciando com dados locais ou fallback.', e);
                atualizarTabela();
            }
        }

        // Auto definir status concluído se colar fotos
        function autoDefinirStatus() {
            const link = document.getElementById('editFotos').value.trim();
            if (link !== '') {
                document.getElementById('editStatus').value = 'concluido';
            }
        }

        // Atualizar tabela e contadores
        function atualizarTabela() {
            const tbody = document.getElementById('tabelaLocais');
            const busca = document.getElementById('inputBusca').value.toLowerCase().trim();
            tbody.innerHTML = '';
            
            let ok = 0, pend = 0;
                                    dadosLocais.forEach((item, idx) => {
                const linkFotos = item.linkFotos || item.fotos || '';
                const isConcluido = (item.status === 'concluido') || (linkFotos.trim() !== '');
                const statusStr = isConcluido ? 'Concluído' : 'Pendente';
                
                if (isConcluido) ok++; else pend++;

                // Filtro busca
                if (busca && !item.nome.toLowerCase().includes(busca) && !(item.endereco && item.endereco.toLowerCase().includes(busca))) {
                    return;
                }

                tbody.innerHTML += `
                <tr class="border-b dark:border-slate-800 hover:bg-slate-800/50">
                    <td class="py-3 px-3 font-bold text-sky-400">#${item.id || item.numero || idx+1}</td>
                    <td class="py-3 px-3 font-semibold text-slate-100">${escapeHtml(item.nome)}</td>
                    <td class="py-3 px-3 text-sm text-slate-400">${escapeHtml(item.endereco || '')}</td>
                    <td class="py-3 px-3 text-xs font-mono text-sky-400">${item.lat ? parseFloat(item.lat).toFixed(5) : 'N/A'}, ${item.lng ? parseFloat(item.lng).toFixed(5) : 'N/A'}</td>
                    <td class="py-3 px-3">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${isConcluido ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-400 border border-amber-500/40'}">
                            ${isConcluido ? '<i class="fa-solid fa-check mr-1"></i> Concluído' : '<i class="fa-solid fa-clock mr-1"></i> Pendente'}
                        </span>
                    </td>
                    <td class="py-3 px-3 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="editarItem(${idx})" class="btn btn-prim text-xs py-1.5 px-3"><i class="fa-solid fa-pen-to-square"></i> Editar & GPS</button>
                            <button onclick="excluirItem(${idx})" class="btn btn-danger text-xs py-1.5 px-2.5"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
            });
            document.getElementById('totalReg').textContent = dadosLocais.length;
            document.getElementById('totalOk').textContent = ok;
            document.getElementById('totalPend').textContent = pend;
        }

        // Inicializar mapa no modal
        function inicializarMapa(lat, lng) {
            if(mapa) mapa.remove();
            mapa = L.map('mapaAuditoria').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
            marcador = L.marker([lat, lng], {draggable: true}).addTo(mapa);
            
            marcador.on('dragend', e => {
                const pos = e.target.getLatLng();
                document.getElementById('editLat').value = pos.lat.toFixed(6);
                document.getElementById('editLng').value = pos.lng.toFixed(6);
            });
            mapa.on('click', e => {
                marcador.setLatLng(e.latlng);
                document.getElementById('editLat').value = e.latlng.lat.toFixed(6);
                document.getElementById('editLng').value = e.latlng.lng.toFixed(6);
            });
            setTimeout(() => mapa.invalidateSize(), 200);
        }

        function atualizarMapaPorInputs() {
            const lat = parseFloat(document.getElementById('editLat').value);
            const lng = parseFloat(document.getElementById('editLng').value);
            if (!isNaN(lat) && !isNaN(lng) && mapa && marcador) {
                marcador.setLatLng([lat, lng]);
                mapa.setView([lat, lng]);
            }
        }

        // Editar item
        function editarItem(indice) {
            const item = dadosLocais[indice];
            document.getElementById('tituloModal').textContent = `Editar Local #${item.id || indice+1}`;
            document.getElementById('editId').value = indice;
            document.getElementById('editNome').value = item.nome || '';
            document.getElementById('editEndereco').value = item.endereco || '';
            document.getElementById('editBairro').value = item.bairro || 'Taquaritinga/SP';
            document.getElementById('editLat').value = item.lat || '-21.4056';
            document.getElementById('editLng').value = item.lng || '-48.5047';
            document.getElementById('editFotos').value = item.linkFotos || item.fotos || '';
            document.getElementById('editStatus').value = item.status || 'pendente';
            
            document.getElementById('modalEditar').classList.remove('hidden');
            inicializarMapa(parseFloat(item.lat) || -21.4056, parseFloat(item.lng) || -48.5047);
        }

        // Novo item
        document.getElementById('btnNovo').addEventListener('click', () => {
            document.getElementById('tituloModal').textContent = 'Adicionar Novo Local';
            document.getElementById('editId').value = 'novo';
            document.getElementById('editNome').value = '';
            document.getElementById('editEndereco').value = '';
            document.getElementById('editBairro').value = 'Taquaritinga/SP';
            document.getElementById('editLat').value = '-21.405600';
            document.getElementById('editLng').value = '-48.504700';
            document.getElementById('editFotos').value = '';
            document.getElementById('editStatus').value = 'pendente';
            document.getElementById('modalEditar').classList.remove('hidden');
            inicializarMapa(-21.4056, -48.5047);
        });

        // Salvar alterações
        document.getElementById('btnSalvar').addEventListener('click', () => {
            const id = document.getElementById('editId').value;
            const nome = document.getElementById('editNome').value.trim();
            const endereco = document.getElementById('editEndereco').value.trim();
            const bairro = document.getElementById('editBairro').value.trim();
            const lat = parseFloat(document.getElementById('editLat').value.trim());
            const lng = parseFloat(document.getElementById('editLng').value.trim());
            const linkFotos = document.getElementById('editFotos').value.trim();
            const status = document.getElementById('editStatus').value;

            if(!nome) {
                alert('Por favor, informe o Nome do Local.');
                return;
            }

            const queryMap = `${nome}, ${endereco}, Taquaritinga SP`.replace(/ /g, '+');
            const linkMaps = `https://www.google.com/maps/search/?api=1&query=${queryMap}`;

            const novoItem = {
                id: id === 'novo' ? (dadosLocais.length > 0 ? Math.max(...dadosLocais.map(l => l.id || 0)) + 1 : 1) : (dadosLocais[parseInt(id)].id || parseInt(id) + 1),
                nome: nome,
                endereco: endereco || `${nome} - Taquaritinga/SP`,
                bairro: bairro || 'Taquaritinga/SP',
                lat: lat,
                lng: lng,
                status: (linkFotos !== '') ? 'concluido' : status,
                linkMaps: linkMaps,
                linkFotos: linkFotos,
                fotos: linkFotos,
                dataAtendimento: "27/07/2026"
            };

            if(id === 'novo') dadosLocais.push(novoItem);
            else dadosLocais[parseInt(id)] = {...dadosLocais[parseInt(id)], ...novoItem};
            
            fecharModal();
            atualizarTabela();
        });

        function excluirItem(i) {
            if(confirm('Deseja excluir este local permanentemente?')) {
                dadosLocais.splice(i, 1);
                atualizarTabela();
            }
        }

        function fecharModal() {
            document.getElementById('modalEditar').classList.add('hidden');
        }
        document.getElementById('btnFechar').onclick = document.getElementById('btnCancelar').onclick = fecharModal;

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Exportar JSON
        document.getElementById('btnExportar').addEventListener('click', () => {
            const ok = dadosLocais.filter(l => l.status === 'concluido' || (l.linkFotos || l.fotos)).length;
            const jsonOutput = {
                ultima_atualizacao: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR'),
                total_locais: dadosLocais.length,
                total_concluidos: ok,
                total_pendentes: dadosLocais.length - ok,
                locais: dadosLocais,
                rotas: dadosCompleto.rotas || []
            };

            const conteudo = JSON.stringify(jsonOutput, null, 2);
            const blob = new Blob([conteudo], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'locais.json';
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ Arquivo locais.json exportado com sucesso! Substitua o arquivo na pasta dados/ do seu projeto.');
        });

        // Iniciar
        carregarDados();
    </script>
</body>
</html>
